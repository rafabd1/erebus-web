[package]
name = "erebus-webd"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Local web traffic capture and mapping runtime for Erebus"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["json", "macros"] }
base64 = "0.22.1"
blake3 = "1.8.7"
bytes = "1.11.1"
clap = { version = "4.5.53", features = ["derive", "env"] }
fastwebsockets = { version = "0.10.0", default-features = false, features = ["unstable-split", "upgrade"] }
globset = "0.4.18"
http = "1.4.0"
http-body-util = "0.1.3"
http-mitm-proxy = { version = "0.18.0", default-features = false, features = ["rustls-client"] }
hyper-util = { version = "0.1.19", features = ["tokio"] }
ipnet = "2.11.0"
pin-project-lite = "0.2.16"
rand = "0.9.2"
rcgen = { version = "0.14.5", features = ["pem", "x509-parser"] }
regex = "1.13.2"
reqwest = { version = "0.12.24", default-features = false, features = ["http2", "rustls-tls-webpki-roots-no-provider"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
time = { version = "0.3.55", features = ["formatting", "parsing", "serde"] }
tokio = { version = "1.54.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.18", features = ["rt"] }
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
url = { version = "2.5.7", features = ["serde"] }
uuid = { version = "1.29.3", features = ["serde", "v4", "v7"] }
zstd = "0.14.4"

[dev-dependencies]
proptest = "1.9.0"
tempfile = "3.23.0"
tower = { version = "0.5.2", features = ["util"] }

[profile.release]
lto = "thin"
strip = true

