<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Erebus Web Capture</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Erebus capture</h1>
          <p>Agent control for this browser.</p>
        </div>
        <span id="connection" class="badge">Not paired</span>
      </header>

      <section class="card" aria-labelledby="connection-heading">
        <div class="section-row">
          <h2 id="connection-heading">Connection</h2>
          <button id="reconnect" type="button" class="secondary">Reconnect</button>
        </div>
        <p class="detail">Erebus finds this browser automatically while the desktop app is running.</p>
      </section>

      <section class="card" aria-labelledby="capture-heading">
        <div class="section-row">
          <h2 id="capture-heading">Agent activity</h2>
          <span id="tab-status" class="status">Idle</span>
        </div>
        <p id="tab-detail" class="detail">No tab is controlled by Erebus.</p>
      </section>

      <section class="queue" aria-live="polite">
        <span><strong id="queued">0</strong> queued</span>
        <span><strong id="failed">0</strong> rejected</span>
        <button id="flush" type="button" class="link">Send now</button>
        <button id="discard" type="button" class="link danger">Discard queued</button>
      </section>
      <p id="error" class="error" hidden></p>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
